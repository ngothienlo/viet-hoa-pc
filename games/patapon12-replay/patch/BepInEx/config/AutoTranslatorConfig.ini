; PATAPON 1+2 REPLAY. Endpoint trống nên không gửi câu thoại đi máy dịch.
; Bắt câu mới: chạy tools\echo_translate.py trước khi mở game.
; OverrideFontTextMeshPro để trống đến khi có font bundle build bằng Unity 2022.3.52f1.
; Không điền TTF thô. Không dùng FallbackFontTextMeshPro.

[Service]
Endpoint=
FallbackEndpoint=

[General]
Language=vi
FromLanguage=en

[TextFrameworks]
EnableTextMeshPro=True

[Behaviour]
EnableUIResizing=False
ForceUIResizing=False
UseStaticTranslations=False
OverrideFont=
OverrideFontTextMeshPro=
FallbackFontTextMeshPro=

[Custom]
Url=http://127.0.0.1:8765/translate
